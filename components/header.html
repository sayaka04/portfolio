<header
  class="fixed top-0 left-0 w-full z-[100] bg-slate-900/50 backdrop-blur-md border-b border-white/10 transition-all duration-300"
>
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    <a
      href="#profile-placeholder"
      data-target="profile-placeholder"
      class="nav-link text-xl font-bold tracking-widest text-white uppercase flex items-center gap-3 group"
    >
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 group-hover:animate-ping"></span>
      <span
        class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400 group-hover:to-cyan-300 transition-colors sfx-trigger"
      >
        Sayaka04
      </span>
    </a>

    <nav
      class="hidden md:flex items-center gap-6 lg:gap-8 text-xs lg:text-sm font-semibold tracking-wider text-slate-300 uppercase"
    >
      <a
        href="#profile"
        data-target="profile"
        class="nav-link hover:text-cyan-400 transition-colors duration-300 relative group sfx-trigger"
      >
        Profile
        <span
          class="absolute -bottom-2 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
      <a
        href="#projects"
        data-target="projects"
        class="nav-link hover:text-cyan-400 transition-colors duration-300 relative group sfx-trigger"
      >
        Projects
        <span
          class="absolute -bottom-2 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
      <a
        href="#experience"
        data-target="experience"
        class="nav-link hover:text-cyan-400 transition-colors duration-300 relative group sfx-trigger"
      >
        Experience
        <span
          class="absolute -bottom-2 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
      <a
        href="#education"
        data-target="education"
        class="nav-link hover:text-cyan-400 transition-colors duration-300 relative group sfx-trigger"
      >
        Education
        <span
          class="absolute -bottom-2 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
      <a
        href="#certificates"
        data-target="certificates"
        class="nav-link hover:text-cyan-400 transition-colors duration-300 relative group sfx-trigger"
      >
        Certifications
        <span
          class="absolute -bottom-2 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"
        ></span>
      </a>
    </nav>

    <button
      class="md:hidden text-slate-300 hover:text-cyan-400 transition-colors sfx-trigger"
      aria-label="Toggle Navigation Menu"
    >
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
</header>
