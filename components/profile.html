<section class="h-screen flex items-center justify-center px-6 relative pt-[150vh]">
  <div id="profile" class="rounded-[2rem] p-10 md:p-12 max-w-7xl w-full">

      <div class="flex-1 text-center lg:text-left z-10 fx-element fx-flip-y">
        <div
          class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-green-500/30 bg-green-500/10 text-green-400 text-xs md:text-sm font-semibold tracking-widest uppercase mb-6 animate-pulse"
        >
          <span class="w-2 h-2 rounded-full bg-green-400"></span>
          <div id="encryptedTextDegreeProfile">[College Degree] [Encrypted]</div>
        </div>

        <h1 class="text-4xl lg:text-6xl font-extrabold text-white mb-6 leading-tight drop-shadow-2xl">
          Laravel. Java.
          <br />
          <span class="text-gradient">Database Architecture.</span>
        </h1>

        <div
          class="text-lg text-slate-200 mb-8 max-w-2xl mx-auto lg:mx-0 drop-shadow-md font-mono text-sm leading-relaxed space-y-1"
        >
          <p>> Primary Stack: PHP (Laravel 10+), Java (Desktop/OOP), MySQL (3NF).</p>
          <p>> Environment: Ubuntu VPS, Nginx, Apache, Supervisor.</p>
          <p>> Focus: Backend Logic, Schema Design, System Integration.</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
          <button
            class="px-8 py-3.5 bg-accent text-slate-900 font-bold rounded-lg hover:bg-white transition-all shadow-lg shadow-accent/20 sfx-trigger"
          >
            Projects
          </button>

          <button
            class="px-8 py-3.5 bg-slate-900/60 backdrop-blur border border-slate-500 text-white font-medium rounded-lg hover:bg-white/10 transition-all flex items-center justify-center gap-2 sfx-trigger"
          >
            Contact Info
          </button>
        </div>
      </div>

      <!-- Profile Photo Side -->
      <div class="flex-1 flex justify-center lg:justify-end z-10 fx-element fx-zoom-blur">
        <div class="relative w-64 h-64 lg:w-80 lg:h-80">
          <div class="absolute inset-0 bg-accent rounded-full blur-[80px] opacity-20 animate-pulse"></div>
          <img
            id="encryptedProfilePicture"
            src="assets/images/placeholders/profile-placeholder.png"
            alt="Profile"
            class="relative w-full h-full object-cover rounded-2xl border-4 border-white/10 shadow-2xl fx-element fx-glow-in"
          />

      </div>
